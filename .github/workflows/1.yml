name: 🔐 Obfuscate edcloudwasm Worker

on:
  schedule:
    # 每天自动混淆同步（可根据需要修改）
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obfuscate-edcloudwasm
  cancel-in-progress: false

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: 📦 Install obfuscator & esbuild
        run: |
          npm install javascript-obfuscator esbuild --no-fund --no-audit

      - name: ⬇️ Download raw source
        run: |
          # 替换为您要拉取的 edcloudwasm 的 _worker.js 原始地址
          curl -sL -o source.js \
            "https://raw.githubusercontent.com/1345695/edcloudwasm/main/_worker.js"
          echo "Downloaded source.js ($(wc -c < source.js) bytes)"

      - name: 🔐 Obfuscate worker
        run: |
          cat > obfuscate.js <<'EOF'
          const fs = require('fs');
          const JSO = require('javascript-obfuscator');

          const source = fs.readFileSync('source.js', 'utf8');

          // 针对 edcloudwasm 适度优化的配置参数
          const options = {
            compact: true,
            controlFlowFlattening: true,
            controlFlowFlatteningThreshold: 0.75,   // 控制流平坦化概率（降低 CPU 消耗）
            deadCodeInjection: true,
            deadCodeInjectionThreshold: 0.4,
            identifierNamesGenerator: 'hexadecimal',
            renameGlobals: false,                  // 必须保持 false，否则 worker 导出失效
            stringArray: true,
            stringArrayEncoding: ['rc4'],
            stringArrayThreshold: 0.75,
            transformObjectKeys: true,
            unicodeEscapeSequence: true,
            splitStrings: true,
            splitStringsChunkLength: 5
          };

          const code = JSO.obfuscate(source, options).getObfuscatedCode();
          fs.writeFileSync('_worker.js', code);
          console.log('Obfuscated _worker.js (' + Buffer.byteLength(code) + ' bytes)');
          EOF
          node obfuscate.js

      - name: ✅ Verify output (esbuild bundle check)
        run: |
          if [ ! -s _worker.js ]; then
            echo "❌ _worker.js is empty!"
            exit 1
          fi
          # 校验 ESM 格式及语法合法性
          npx esbuild _worker.js --bundle --format=esm \
            --external:cloudflare:sockets --outfile=/dev/null --log-level=error
          
          # 校验 Worker 必须的导出声明
          if ! grep -q "export default" _worker.js; then
            echo "❌ export default missing in _worker.js!"
            exit 1
          fi
          echo "✅ Obfuscation verified ($(wc -c < _worker.js) bytes)"

      - name: 📝 Commit obfuscated code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "🔐 Auto-obfuscate: update edcloudwasm worker"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          file_pattern: "_worker1.js"
          push_options: "--force-with-lease"
