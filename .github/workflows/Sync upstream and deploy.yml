name: Sync upstream and deploy

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force redeploy to Cloudflare"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: edcloudwasm-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTREAM_REPOSITORY: 1345695/edcloudwasm
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main

      - name: Align main to upstream & update wrangler.toml
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          upstream_commit="$(git rev-parse upstream/main)"
          head_commit="$(git rev-parse HEAD)"
          echo "upstream_commit=${upstream_commit}"
          echo "head_commit=${head_commit}"

          # 1. 备份你当前仓库里的 wrangler.toml
          cp wrangler.toml /tmp/my_wrangler.toml

          # 2. 拉取上游最新代码
          git checkout --force "${upstream_commit}" -- .
          git checkout HEAD -- .github/

          # 3. 提取备份中的自定义字段（排除 UUID），更新 wrangler.toml 并填充当前 UTC 日期
          python3 - <<'EOF'
          import re
          from datetime import datetime, timezone

          mine = open('/tmp/my_wrangler.toml').read()
          vals = {}

          today_utc = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          print(f"自动将 compatibility_date 设置为当前 UTC 日期: {today_utc}")

          # 提取自定义变量（剔除 UUID，避免写进文件提交）
          for key in ['name', 'PASSWORD', 'SSPASS', 'S5HTTPUSER', 'S5HTTPPASS']:
              m = re.search(rf'^{key}\s*=\s*"([^"]*)"', mine, re.M)
              if m:
                  vals[key] = m.group(1)

          cur = open('wrangler.toml').read()

          # 强制清理 wrangler.toml 里可能残留的 UUID 定义
          cur = re.sub(r'^\s*UUID\s*=.*$\n?', '', cur, flags=re.M)

          # 动态更新或添加 compatibility_date
          if re.search(r'^compatibility_date\s*=', cur, re.M):
              cur = re.sub(r'^compatibility_date\s*=\s*"[^"]*"', f'compatibility_date = "{today_utc}"', cur, flags=re.M)
          else:
              cur += f'\ncompatibility_date = "{today_utc}"\n'

          # 还原包含 name 和环境变量在内的其它个人配置
          for key, val in vals.items():
              if re.search(rf'^{key}\s*=', cur, re.M):
                  cur = re.sub(rf'^{key}\s*=\s*"[^"]*"', f'{key} = "{val}"', cur, flags=re.M)
              else:
                  cur += f'\n{key} = "{val}"\n'

          # 确保 [limits] 和 cpu_ms 被注释
          cur = re.sub(r'^\s*(\[limits\])', r'#\1', cur, flags=re.M)
          cur = re.sub(r'^\s*(cpu_ms\s*=.*)', r'#\1', cur, flags=re.M)

          # 如果你的备份里取消了 placement 和 节点注释，同步取消上游文件中的注释
          if re.search(r'^\s*\[placement\]', mine, re.M):
              cur = re.sub(r'^\s*#\s*(\[placement\])', r'\1', cur, flags=re.M)
          if re.search(r'^\s*region\s*=\s*"azure:japanwest"', mine, re.M):
              cur = re.sub(r'^\s*#\s*(region\s*=\s*"azure:japanwest".*)', r'\1', cur, flags=re.M)

          # 清理连续重复注释
          cur = re.sub(r'^#+\s*#', '#', cur, flags=re.M)

          open('wrangler.toml', 'w').write(cur)
          print('wrangler.toml 配置更新完成（已安全剔除 UUID 明文）！')
          EOF

          # 4. 检查变动并提交
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream ${UPSTREAM_REPOSITORY} (${upstream_commit:0:7}) with custom config and updated compatibility_date"
            git push origin HEAD:main
            echo "Synced and pushed to main."
            echo "updated=true" >> "${GITHUB_OUTPUT}"
          else
            git reset --hard HEAD
            echo "No changes after applying upstream and custom config."
            echo "updated=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        env:
          UUID: ${{ secrets.UUID }}
        run: |
          npx wrangler deploy --var UUID:"$UUID"
